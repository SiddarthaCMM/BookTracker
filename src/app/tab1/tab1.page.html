<ion-content class="ion-padding">
  
  <div class="page-header">
    <h2>Gestión de Usuarios</h2>
    <ion-button shape="round" (click)="abrirModalCrear()">
      <ion-icon slot="start" name="person-add"></ion-icon>
      Nuevo Usuario
    </ion-button>
  </div>

  <!-- Tabla de Usuarios -->
  <div class="table-container">
    <table>
      <thead>
        <tr>
          <th>ID</th>
          <th>Correo Electrónico</th>
          <th>Fecha de Creación</th>
          <th class="acciones-col">Acciones</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let u of usuarios">
          <td>{{ u.id }}</td>
          <td>{{ u.email }}</td>
          <td>{{ u.created_at | date:'short' }}</td>
          <td class="acciones-col">
            <ion-button fill="clear" size="small" (click)="abrirModalEditar(u)">
              <ion-icon slot="icon-only" name="create-outline" color="primary"></ion-icon>
            </ion-button>
            <ion-button fill="clear" size="small" (click)="eliminarUsuario(u.id)">
              <ion-icon slot="icon-only" name="trash-outline" color="danger"></ion-icon>
            </ion-button>
          </td>
        </tr>
        <tr *ngIf="usuarios.length === 0">
          <td colspan="4" class="empty-state">No hay usuarios registrados.</td>
        </tr>
      </tbody>
    </table>
  </div>

  <!-- Modal para Crear / Editar -->
  <ion-modal [isOpen]="isModalOpen" (didDismiss)="cerrarModal()">
    <ng-template>
      <ion-header>
        <ion-toolbar color="primary">
          <ion-title>{{ esNuevo ? 'Nuevo Usuario' : 'Editar Usuario' }}</ion-title>
          <ion-buttons slot="end">
            <ion-button (click)="cerrarModal()">
              <ion-icon slot="icon-only" name="close-circle"></ion-icon>
            </ion-button>
          </ion-buttons>
        </ion-toolbar>
      </ion-header>
      <ion-content class="ion-padding">
        
        <ion-item lines="full">
          <ion-input 
            type="email" 
            label="Correo electrónico" 
            labelPlacement="stacked"
            [(ngModel)]="usuarioEditando.email"
            placeholder="ejemplo@correo.com">
          </ion-input>
        </ion-item>

        <ion-item lines="full">
          <ion-input 
            type="password" 
            label="Contraseña" 
            labelPlacement="stacked"
            [(ngModel)]="usuarioEditando.password"
            placeholder="Ingresa una contraseña segura">
          </ion-input>
        </ion-item>

        <div class="modal-actions">
          <ion-button expand="block" (click)="guardarUsuario()">
            {{ esNuevo ? 'Crear Usuario' : 'Guardar Cambios' }}
          </ion-button>
        </div>

      </ion-content>
    </ng-template>
  </ion-modal>

</ion-content>
