<ion-header class="ion-no-border">
  <ion-toolbar color="primary">
    <ion-title>Mi Perfil</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  
  <div class="profile-header">
    <div class="avatar-container" (click)="tomarFoto()">
      <img *ngIf="perfil.foto_url" [src]="perfil.foto_url" class="avatar">
      <ion-icon *ngIf="!perfil.foto_url" name="person-circle-outline" class="placeholder-avatar"></ion-icon>
      <div class="camera-badge">
        <ion-icon name="camera-outline"></ion-icon>
      </div>
    </div>
    <p class="hint">Toca la foto para cambiarla y editarla</p>
  </div>

  <ion-item lines="full">
    <ion-input label="Usuario" labelPlacement="stacked" [(ngModel)]="perfil.username"></ion-input>
  </ion-item>

  <ion-item lines="full">
    <ion-input label="Nombre" labelPlacement="stacked" [(ngModel)]="perfil.nombre"></ion-input>
  </ion-item>

  <ion-item lines="full">
    <ion-input label="Correo" labelPlacement="stacked" type="email" [(ngModel)]="perfil.email"></ion-input>
  </ion-item>

  <ion-item lines="full">
    <ion-input label="Fecha de Nacimiento" labelPlacement="stacked" type="date" [(ngModel)]="perfil.birth_date"></ion-input>
  </ion-item>

  <ion-item lines="full">
    <ion-select label="Idioma Preferido" labelPlacement="stacked" [(ngModel)]="perfil.idioma">
      <ion-select-option value="es">Español</ion-select-option>
      <ion-select-option value="en">Inglés</ion-select-option>
      <ion-select-option value="fr">Francés</ion-select-option>
    </ion-select>
  </ion-item>

  <ion-item lines="full">
    <ion-input label="Lector Electrónico (E-Reader)" labelPlacement="stacked" [value]="dispositivoConectado || 'No conectado'" readonly></ion-input>
  </ion-item>

  <ion-button expand="block" fill="outline" class="save-btn" (click)="dispositivoConectado ? desconectarLector() : conectarLector()">
    <ion-icon slot="start" name="bluetooth-outline"></ion-icon>
    {{ dispositivoConectado ? 'Desconectar lector' : 'Conectar vía Bluetooth' }}
  </ion-button>

  <ion-button expand="block" class="save-btn" [disabled]="guardando" (click)="guardar()">
    <ion-icon slot="start" name="save-outline"></ion-icon>
    Guardar Cambios
  </ion-button>

  <!-- MODAL DEL PHOTOEDITOR SDK -->
  <ion-modal [isOpen]="isEditorOpen" (didDismiss)="cerrarPhotoEditor()" (didPresent)="inicializarEditor()">
    <ng-template>
      <ion-header>
        <ion-toolbar color="dark">
          <ion-title>Photo Editor SDK</ion-title>
          <ion-buttons slot="end">
            <ion-button (click)="cerrarPhotoEditor()">Cerrar</ion-button>
          </ion-buttons>
        </ion-toolbar>
      </ion-header>
      <ion-content [fullscreen]="true" [scrollY]="false">
        <!-- Aquí se inyecta el SDK. Necesita un alto explícito: con height:100% dentro de
             ion-content medía 0px y el editor no se veía. -->
        <div id="pesdk-container" style="position: absolute; inset: 0;"></div>
      </ion-content>
    </ng-template>
  </ion-modal>

</ion-content>
