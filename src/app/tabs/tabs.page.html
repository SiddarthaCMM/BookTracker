<ion-header class="ion-no-border">
  <ion-toolbar color="primary">
    <ion-title>Menú Principal</ion-title>
    <ion-buttons slot="end">
      <!-- Indicador Visual Offline -->
      <ion-badge *ngIf="!isOnline" color="danger" style="margin-right: 15px; padding: 5px;">
        <ion-icon name="cloud-offline-outline"></ion-icon> OFFLINE
      </ion-badge>
      <ion-button (click)="cerrarSesion()">
        <ion-icon slot="icon-only" name="log-out-outline"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-tabs>
  <ion-tab-bar slot="bottom">
    <ion-tab-button tab="tab1" href="/tabs/tab1">
      <ion-icon aria-hidden="true" name="people-outline"></ion-icon>
      <ion-label>Usuarios</ion-label>
    </ion-tab-button>

    <ion-tab-button tab="tab2" href="/tabs/tab2">
      <ion-icon aria-hidden="true" name="library-outline"></ion-icon>
      <ion-label>Libros</ion-label>
    </ion-tab-button>

    <ion-tab-button tab="tab3" href="/tabs/tab3">
      <ion-icon aria-hidden="true" name="stats-chart-outline"></ion-icon>
      <ion-label>Dashboard</ion-label>
    </ion-tab-button>
  </ion-tab-bar>
</ion-tabs>
