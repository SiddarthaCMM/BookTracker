<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>Login</ion-title>
    <ion-buttons slot="end">
      <ion-button (click)="abrirConfig()">
        <ion-icon slot="icon-only" name="settings-outline"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" class="ion-padding">
  <form id="msform" (ngSubmit)="login()">
    <fieldset>
      <h2 class="fs-title">Iniciar Sesión</h2>
      <h3 class="fs-subtitle">Ingresa tus credenciales</h3>

      <input
        type="email"
        name="email"
        placeholder="Correo electrónico"
        autocomplete="username"
        inputmode="email"
        autocapitalize="off"
        spellcheck="false"
        [(ngModel)]="user.email"
        required />

      <div class="password-wrap">
        <input
          [type]="mostrarPassword ? 'text' : 'password'"
          name="password"
          placeholder="Contraseña"
          autocomplete="current-password"
          [(ngModel)]="user.password"
          required />
        <button
          type="button"
          class="toggle-eye"
          (click)="mostrarPassword = !mostrarPassword"
          [attr.aria-label]="mostrarPassword ? 'Ocultar contraseña' : 'Mostrar contraseña'">
          {{ mostrarPassword ? '🙈' : '👁' }}
        </button>
      </div>

      <label class="remember-row">
        <input type="checkbox" name="remember_me" [(ngModel)]="user.remember_me" />
        <span>Mantener sesión iniciada</span>
      </label>

      <input
        type="submit"
        value="{{ bloqueoLabel ? bloqueoLabel : (enviando ? 'Entrando…' : 'Entrar') }}"
        class="submit action-button"
        [disabled]="enviando || bloqueadoSeg > 0" />

      <div class="links-row">
        <a (click)="irARegistro()">Crear cuenta</a>
        <span class="sep">·</span>
        <a (click)="irARecuperar()">¿Olvidaste tu contraseña?</a>
      </div>
    </fieldset>
  </form>
</ion-content>

<ion-modal [isOpen]="isConfigOpen" (didDismiss)="cerrarConfig()">
  <ng-template>
    <ion-header>
      <ion-toolbar color="primary">
        <ion-title>Configuración</ion-title>
        <ion-buttons slot="end">
          <ion-button (click)="cerrarConfig()">Cerrar</ion-button>
        </ion-buttons>
      </ion-toolbar>
    </ion-header>
    <ion-content class="ion-padding">
      <ion-item lines="full">
        <ion-input
          label="IP del Servidor"
          labelPlacement="stacked"
          [(ngModel)]="ipInput"
          placeholder="Ej: 192.168.1.65 (vacío = por defecto)">
        </ion-input>
      </ion-item>
      <ion-button expand="block" style="margin-top: 20px;" (click)="guardarIp()">
        Guardar IP
      </ion-button>
    </ion-content>
  </ng-template>
</ion-modal>
